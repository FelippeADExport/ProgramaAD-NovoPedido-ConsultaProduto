<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AD Export — Pedidos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">AD EXPORT</div>
  <div class="topbar-right">
    <span id="status-conexao" class="status-online">● Online</span>
  </div>
</header>

<div id="badge-pendentes" class="badge-pendentes hidden"></div>

<div class="sync-bar">
  <button id="btn-atualizar-dados" class="btn btn-secondary">⟳ Atualizar dados</button>
  <span id="ultima-sync-texto" class="sync-texto"></span>
  <div id="sync-progresso" class="sync-progresso hidden">
    <div class="sync-barra"><div id="sync-barra-interna" class="sync-barra-interna"></div></div>
    <span id="sync-texto"></span>
  </div>
</div>

<nav class="tabs">
  <button class="tab-btn active" data-tab="consulta">Consulta Produto</button>
  <button class="tab-btn" data-tab="pedido">Novo Pedido</button>
</nav>

<main>

  <!-- ===================== CONSULTA PRODUTO ===================== -->
  <section id="tab-consulta" class="tab-pane active">
    <div class="cp-filtros">
      <input type="text" id="cp-busca" placeholder="Buscar por código, nome, linha ou cor...">
      <select id="cp-filtro-linha"><option value="">Linha</option></select>
      <select id="cp-filtro-formato"><option value="">Formato</option></select>
      <select id="cp-filtro-cor"><option value="">Cor</option></select>
    </div>
    <div id="cp-contagem" class="cp-contagem"></div>
    <div id="cp-grid" class="cp-grid"></div>
  </section>

  <!-- ===================== NOVO PEDIDO ===================== -->
  <section id="tab-pedido" class="tab-pane">
    <div class="np-header">
      <div>Pedido <strong id="numeroPedidoNovo">—</strong></div>
    </div>

    <div class="card">
      <h3>Cliente</h3>
      <div class="autocomplete-wrap">
        <input type="text" id="np-cliente-busca" placeholder="Buscar cliente por nome..." oninput="buscarClientesUI()">
        <div class="autocomplete-list hidden" id="np-cliente-lista"></div>
      </div>
      <div id="np-cliente-selecionado" class="np-cliente-selecionado hidden"></div>

      <div id="np-cliente-form-novo" class="hidden mt-8">
        <div class="grid grid-2">
          <div><label>Nome *</label><input type="text" id="ncNome"></div>
          <div><label>Contato</label><input type="text" id="ncContato"></div>
          <div><label>Endereço</label><input type="text" id="ncEndereco"></div>
          <div><label>Complemento</label><input type="text" id="ncComplemento"></div>
          <div><label>Cidade</label><input type="text" id="ncCidade"></div>
          <div><label>Província/Estado</label><input type="text" id="ncProvincia"></div>
          <div><label>País</label><input type="text" id="ncPais"></div>
          <div><label>CEP</label><input type="text" id="ncCep"></div>
          <div><label>Telefone</label><input type="text" id="ncTelefone"></div>
          <div><label>Email</label><input type="text" id="ncEmail"></div>
        </div>
        <button type="button" class="btn btn-primary mt-8" onclick="salvarClienteNovoESelecionar()">Salvar cliente</button>
      </div>
    </div>

    <div class="card">
      <h3>Tabela de preço e frete</h3>
      <div class="btn-group">
        <button type="button" id="np-btn-fob" class="btn-toggle active" onclick="setPrice('FOB')">FOB</button>
        <button type="button" id="np-btn-exw" class="btn-toggle" onclick="setPrice('EXW')">EXW</button>
      </div>
      <div class="btn-group mt-8">
        <button type="button" id="np-btn-maritimo" class="btn-toggle active" onclick="setFrete('maritimo')">🚢 Marítimo</button>
        <button type="button" id="np-btn-rodoviario" class="btn-toggle" onclick="setFrete('rodoviario')">🚛 Rodoviário</button>
      </div>
      <div id="np-porto-maritimo" class="mt-8">
        <label>Porto de destino</label>
        <select id="np-porto-select"></select>
        <label class="mt-8">Porto/cidade de chegada final</label>
        <input type="text" id="np-porto-chegada" placeholder="opcional">
      </div>
      <div id="np-porto-rodoviario" class="mt-8 hidden">
        <div class="rodoviario-origem">Origem fixa: <strong>CRICIÚMA — SC</strong></div>
      </div>
    </div>

    <div class="card">
      <h3>Itens do pedido</h3>
      <div id="np-itens-lista"></div>
      <button type="button" class="btn btn-secondary mt-8" onclick="adicionarItem()">+ Adicionar item</button>
    </div>

    <div class="card">
      <h3>Resumo</h3>
      <table class="tabela-resumo">
        <thead><tr><th>#</th><th>Produto</th><th>Unid.</th><th>Qtd</th><th>Total</th><th>Peso</th></tr></thead>
        <tbody id="np-resumo-tabela"></tbody>
      </table>
      <div class="np-totais">
        <div><label>Subtotal</label><span id="np-subtotal">US$ 0,00</span></div>
        <div>
          <label>Desconto (%)</label>
          <input type="number" id="np-desconto" min="0" max="100" step="0.1" value="0" oninput="atualizarResumoPedido()">
          <span id="np-desconto-valor">— US$ 0,00</span>
        </div>
        <div class="np-total-final"><label>Total</label><span id="np-total">US$ 0,00</span></div>
      </div>
      <label class="mt-8">Observações</label>
      <textarea id="np-observacoes" rows="3"></textarea>
      <button type="button" class="btn btn-primary btn-full mt-12" onclick="salvarPedidoAtual()">Salvar pedido</button>
    </div>
  </section>

</main>

<!-- Modal detalhe produto -->
<div id="modal-produto" class="modal">
  <div class="modal-conteudo">
    <button class="modal-fechar" onclick="fecharModalProduto()">×</button>
    <h2 id="mp-titulo"></h2>
    <div id="mp-corpo"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/produtos.js"></script>
<script src="js/pedido.js"></script>
<script src="js/app.js"></script>
</body>
</html>
